[workspace]
channels = ["conda-forge"]
name = "icassp27-phrase"
platforms = ["linux-64"]
version = "0.1.1"

[dependencies]
python = ">=3.12,<3.13"
numpy = ">=2,<3"
numba = ">=0.61,<0.67"
scipy = ">=1.11,<1.17"
pytest = ">=8,<10"
ruff = ">=0.12,<1"
tectonic = ">=0.15,<0.16"
pip = ">=25,<27"
ninja = ">=1.11,<2"
wheel = ">=0.45,<1"

[pypi-options]
extra-index-urls = ["https://download.pytorch.org/whl/cu126"]
index-strategy = "unsafe-best-match"

[pypi-dependencies]
torch = "==2.7.1+cu126"
flamo = "==0.2.18"
marimo = "==0.23.11"
plotly = ">=6.3,<7"
setuptools-git-versioning = "==2.1.0"
icassp27-phrase = { path = ".", editable = true }

[tasks]
install-backends = "bash scripts/install_backends.sh"
install-cpu-backends = "ICASSP27_BACKEND_DEVICE=cpu ICASSP27_BACKEND_DEVICE_ACTUAL=cpu bash scripts/install_backends.sh"
test = "python -m pytest"
lint = "ruff check src tests notebooks scripts"
notebook-check = "marimo check notebooks/optimize_phrase.py"
notebook = "marimo edit notebooks/optimize_phrase.py"
app = "marimo run notebooks/optimize_phrase.py"
cpu-check = "python scripts/qualify_cpu_notebook.py"
gpu-check = "python scripts/qualify_gpu.py"
paper = "bash -lc 'cd paper && mkdir -p build && tectonic -X compile main.tex --outdir build'"
