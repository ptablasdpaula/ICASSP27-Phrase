name: Publish cels-audio

on:
  push:
    tags:
      - "cels-v*"

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release identity
        run: |
          python - <<'PYTHON'
          import os
          import tomllib
          from pathlib import Path
          project = tomllib.loads(Path("pyproject.toml").read_text())["project"]
          assert project["name"] == "cels-audio"
          assert os.environ["GITHUB_REF_NAME"] == "cels-v" + project["version"]
          PYTHON

      - name: Build package
        run: |
          python -m pip install build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
