[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "icassp27-phrase"
version = "0.2.1"
description = "Differentiable plucked-string phrase recovery for ICASSP 2027"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12,<3.14"
dependencies = [
  "flamo==0.2.18",
  "numba>=0.61,<0.67",
  "numpy>=2,<3",
  "scipy>=1.11,<1.17",
  "torch==2.7.1",
  "matplotlib>=3.11,<3.12",
  "python-dotenv>=1,<2",
  "cels-audio==0.1.0",
]

[project.optional-dependencies]
notebook = [
  "marimo==0.23.11",
  "plotly>=6.3,<7",
]
dev = ["ruff>=0.12,<1"]
accelerated = [
  "torchlpc @ git+https://github.com/DiffAPF/torchlpc.git@1bfde4a457f87b1dd0fc22a6548206be3a26647c",
  "philtorch @ git+https://github.com/yoyolicoris/philtorch.git@710946142b6149b486a37f4a3be87ddbf9e2cda3",
]

[tool.setuptools]
packages = ["icassp27_phrase", "icassp27_phrase.synth", "icassp27_phrase.data"]
package-dir = { icassp27_phrase = "src" }
include-package-data = true

[tool.setuptools.package-data]
icassp27_phrase = ["data/*.json"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
