[build-system]
requires = ["setuptools>=77", "wheel>=0.45"]
build-backend = "setuptools.build_meta"

[project]
name = "cels-audio"
version = "0.1.1"
description = "Cumulative Energy Losses for differentiable audio optimisation"
readme = { content-type = "text/markdown", text = """
# cels-audio

Differentiable Cumulative Energy Losses (CeLs) for PyTorch. Compare energy
accumulated along any selection of four diagonal and four orthogonal directions,
with optional logarithmic frequency weighting and finite-horizon decay.

```bash
pip install cels-audio
```

```python
from cels import STFTCumulativeEnergyLoss

loss = STFTCumulativeEnergyLoss(sample_rate=16000)
# candidate and target are waveform tensors; gradients flow through candidate.
value = loss(candidate, target)
value.backward()
```

For examples, the cumulative-energy figure, mathematical definitions and the
paper citation, see the [library documentation](https://github.com/ptablasdpaula/ICASSP27-Phrase/tree/cel-library).

Requires Python 3.10 or later and PyTorch 2.1 or later. MIT licensed.
""" }
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Pablo Tablas de Paula"}]
dependencies = ["torch>=2.1"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Analysis",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.12"]

[project.urls]
Repository = "https://github.com/ptablasdpaula/ICASSP27-Phrase/tree/cel-library"

[tool.setuptools]
packages = ["cels"]
package-dir = {cels = "src/cels"}

[tool.setuptools.package-data]
cels = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
